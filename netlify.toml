[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"

# ── Security Headers ───────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking protection
    X-Frame-Options = "DENY"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Restrict referrer info leakage
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Disable dangerous browser APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), interest-cohort=()"
    # XSS protection for legacy browsers
    X-XSS-Protection = "1; mode=block"
    # Content Security Policy
    # - default-src: only allow same-origin by default
    # - script-src: allow self + unsafe-inline required by React/Vite SSR; restrict to known CDNs
    # - style-src: allow self + Google Fonts + inline styles (needed by Tailwind/component styles)
    # - font-src: allow self + Google Fonts
    # - img-src: allow self + data URIs (for base64 logo/images) + blob
    # - connect-src: allow same-origin + Google Script (for Sheets sync)
    # - frame-ancestors: deny embedding in iframes
    # - object-src: block all plugins
    # - base-uri: restrict <base> tag to prevent base injection
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"

# ── Static asset caching headers ──────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
